[Settings]

;Whether neutral NPCs should be considered as friends or allies when hitting them. This affects the number of hits they'll take before turning hostile (see gamesettings)
SetAsAlly = false

;Neutral NPCs will only ignore player hits during combat
OnlyCombat = false

;Overrides the above settings. Neutral NPCs will ALWAYS ignore hits from the player
IgnoreFriendlyFire = false

;Modify following gamesettings using config. These can still be modified by other mods during playtime
ModifyGameSettings = false


[GameSettings]
iFriendHitNonCombatAllowed = 0
iFriendHitCombatAllowed = 4
iAllyHitNonCombatAllowed = 3
iAllyHitCombatAllowed = 1000

[Exclusions]
; Hostile Safeguard — do NOT suppress offence for temporarily-calm enemies

ExcludeVeryAggressive = true
UseKeywordExclusion = true
ExclusionKeyword = SOS_NoOffenceSuppression
ExclusionFormList = SOS_HostileFactionList

; Factions (EditorIDs). Toll bandits / Arvel's BanditAllyFaction / forsworn camps / etc.
HostileFactions = BanditFaction,BanditAllyFaction,BanditFriendFaction,WarlockFaction,ForswornFaction,NecromancerFaction,HagravenFaction,VampireFaction,VampireThrallFaction,WerewolfFaction,DraugrFaction,FalmerFaction,GiantFaction,TrollFaction,SprigganFaction,DwarvenAutomatonFaction,WolfFaction,ThalmorFaction,PenitusOculatusFaction,WE06BanditFaction,WE19BanditFaction,WE20BanditFaction,MS07BanditFaction,MS07BanditSiblings,dunValtheimKeepBanditFaction,dunRobbersGorgeBanditFaction,DunAnsilvundBanditFaction,dunIcerunnerBanditFaction,DLC1VampireFaction,DLC1VampireCompanionFaction,DLC2CultistFaction,DLC2RieklingFaction,DLC2BanditDialogueFaction

; Unique NPC bases with empty or useless faction lists (Weylin has ZERO factions!)
; Add more EditorIDs here for modded scripted assassins that stay "friendly" until the scene fires.
HostileNPCs = MS01Weylin,MS13Arvel,e3DemoArvel
